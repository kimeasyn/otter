[package]
name = "otter-desktop"
version = "0.1.0"
description = "Otter — Local-first AI Development Control Center"
authors = ["Otter contributors"]
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
libc = "0.2"

[profile.dev]
debug = 0

[profile.release]
strip = true
